<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · haggle</title><link rel="stylesheet" href="/static/style.css">
<main style="max-width:32rem;margin:4rem auto;padding:1rem"><h1>haggle.</h1><p>Sign in with your access token.</p>
<form id="login"><label for="token">Access token</label><input id="token" type="password" required autocomplete="current-password" style="width:100%;padding:1rem;margin:1rem 0">
<button class="btn btn-ink">Sign in</button></form><p id="error" role="alert"></p></main>
<script>document.querySelector('#login').onsubmit=async(e)=>{e.preventDefault();try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:document.querySelector('#token').value})});if(!r.ok)throw new Error('Invalid access token');location.href='/';}catch(e){document.querySelector('#error').textContent=e.message;}};</script></html>
